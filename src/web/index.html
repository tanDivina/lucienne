<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucienne</title>
<meta name="description" content="Lucienne — conversational website & SEO copilot. Drop a link, get clarity.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Lucienne">
<meta property="og:description" content="Drop me a link. I'll bring some clarity. Website & SEO copilot on Amazon Bedrock.">
<meta property="og:image" content="https://3aeprrnzvxpaum6k7vq4qccvd40pcngi.lambda-url.us-east-1.on.aws/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #faf8f4;
    --ink: #1f1b16;
    --muted: #7a7267;
    --accent: #8a6d1f;
    --accent-soft: #f0e7d2;
    --card: #ffffff;
    --line: #e7e0d4;
    --me: #efe9dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --ink: #ece7de;
      --muted: #9b937f;
      --accent: #d9b75c;
      --accent-soft: #2a2416;
      --card: #201c15;
      --line: #322c21;
      --me: #2a251c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 "Source Serif 4", Georgia, serif;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    padding: 28px 16px 18px; text-align: center; border-bottom: 1px solid var(--line);
  }
  .stage { width: 148px; margin: 0 auto 12px; position: relative; }
  .stage img {
    width: 100%; display: block; border-radius: 20px;
    border: 1px solid var(--line);
    animation: sway 7s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-.7deg) translateY(0); }
    50% { transform: rotate(.7deg) translateY(-2px); }
  }
  .stage.thinking img {
    animation: sway 7s ease-in-out infinite, glow 1.8s ease-in-out infinite;
  }
  @keyframes glow { 50% { box-shadow: 0 0 34px rgba(217, 183, 92, .55); } }
  @media (prefers-reduced-motion: reduce) { .stage img { animation: none !important; } }
  .voicebtn {
    margin-top: 10px; background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 14px 5px 10px; cursor: pointer;
    color: var(--muted); font: 12px system-ui, sans-serif;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .voicebtn svg { width: 16px; height: 16px; stroke: var(--accent); }
  .voicebtn.on { border-color: var(--accent); color: var(--ink); }
  .micbtn {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); cursor: pointer; display: none;
  }
  .micbtn svg { width: 20px; height: 20px; stroke: var(--accent); display: block; }
  .micbtn.listening { outline: 2px solid var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none;
    margin-right: 10px; margin-top: 2px; border: 1px solid var(--line);
  }
  h1 {
    margin: 0; font-size: 30px; font-weight: 600; letter-spacing: .04em;
    font-family: "Cormorant Garamond", Georgia, serif;
  }
  .tag { margin: 4px 0 0; color: var(--muted); font-size: 14px; font-style: italic; }
  main {
    flex: 1; width: 100%; max-width: 680px; margin: 0 auto; padding: 20px 16px 140px;
  }
  .msg { margin: 14px 0; display: flex; }
  .msg.me { justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 12px 16px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .me .bubble { background: var(--me); }
  .who {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px; font-family: system-ui, sans-serif;
  }
  .thinking .bubble::after {
    content: ""; display: inline-block; width: 1.2em; text-align: left;
    animation: dots 1.4s steps(4) infinite;
  }
  @keyframes dots { 0% {content:""} 25% {content:"."} 50% {content:".."} 75% {content:"..."} }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font: 14px "Source Serif 4", Georgia, serif;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  form {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .row { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
  input {
    flex: 1; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: inherit; min-width: 0;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: var(--bg); font: 600 15px system-ui, sans-serif;
  }
  button:disabled { opacity: .5; cursor: default; }
  .note {
    max-width: 680px; margin: 8px auto 0; color: var(--muted); font-size: 12px;
    text-align: center; font-family: system-ui, sans-serif;
  }
</style>
</head>
<body>
<header>
  <div class="stage">
    <img id="lulu" src="assets/pose-neutral.png" alt="Lucienne, a chic French inspector holding a glowing hand lantern" width="148" height="148">
  </div>
  <h1>Lucienne</h1>
  <p class="tag">Drop me a link. I'll bring some clarity.</p>
  <button id="voice" class="voicebtn" type="button" aria-pressed="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
    </svg>
    <span class="label">Voice on</span>
  </button>
</header>

<main id="log" aria-live="polite"></main>

<form id="f">
  <div class="row">
    <button id="mic" class="micbtn" type="button" aria-label="Speak to Lucienne">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
      </svg>
    </button>
    <input id="inp" placeholder="Paste a website address…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </div>
  <p class="note">Lucienne inspects the page, checks Core Web Vitals, and can email the full developer report. Built on Amazon Bedrock, AWS End User Messaging &amp; Amazon SES — her voice is Amazon Polly.</p>
</form>

<script>
const log = document.getElementById('log');
const f = document.getElementById('f');
const inp = document.getElementById('inp');
const send = document.getElementById('send');
const sid = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

// --- Lucienne lives: blink, sway, inspect, delight, speak ---
const lulu = document.getElementById('lulu');
const stage = document.querySelector('.stage');
const POSES = {
  n: 'assets/pose-neutral.png', t: 'assets/pose-talk.png', b: 'assets/pose-blink.png',
  i: 'assets/pose-inspect.png', d: 'assets/pose-delight.png'
};
for (const s of Object.values(POSES)) { const im = new Image(); im.src = s; }

let mood = 'idle'; // idle | thinking | talking
let flap = null;
function setMood(m) {
  mood = m;
  stage.classList.toggle('thinking', m === 'thinking');
  if (m !== 'talking' && flap) { clearInterval(flap); flap = null; }
  if (m === 'idle') lulu.src = POSES.n;
  else if (m === 'thinking') lulu.src = POSES.i;
  else if (m === 'talking' && !flap) {
    flap = setInterval(() => { lulu.src = lulu.src.includes('talk') ? POSES.n : POSES.t; }, 150);
  }
}
function delight() { // quick proud flash when results land
  if (mood !== 'idle') return;
  lulu.src = POSES.d;
  setTimeout(() => { if (mood === 'idle' && lulu.src.includes('delight')) lulu.src = POSES.n; }, 1600);
}
(function blink() {
  if (mood === 'idle' && !lulu.src.includes('delight')) {
    lulu.src = POSES.b;
    setTimeout(() => { if (mood === 'idle' && lulu.src.includes('blink')) lulu.src = POSES.n; }, 140);
  }
  setTimeout(blink, 2800 + Math.random() * 3500);
})();

let voiceOn = false; // opt-in: her voice is a garnish, not a monologue
try { voiceOn = localStorage.getItem('lucienne-voice') === 'on'; } catch (e) {}
const voiceBtn = document.getElementById('voice');
function renderVoiceBtn() {
  voiceBtn.classList.toggle('on', voiceOn);
  voiceBtn.setAttribute('aria-pressed', String(voiceOn));
  voiceBtn.querySelector('.label').textContent = voiceOn ? 'Voice on' : 'Voice off';
  voiceBtn.querySelector('.waves').style.display = voiceOn ? '' : 'none';
}
voiceBtn.onclick = () => {
  voiceOn = !voiceOn;
  if (!voiceOn && player) player.pause();
  try { localStorage.setItem('lucienne-voice', voiceOn ? 'on' : 'off'); } catch (e) {}
  renderVoiceBtn();
};
renderVoiceBtn();

let player = null;
function speakReply(b64) {
  try {
    if (player) player.pause();
    player = new Audio('data:audio/mpeg;base64,' + b64);
    player.onplay = () => setMood('talking');
    player.onended = player.onpause = () => setMood('idle');
    player.play().catch(() => setMood('idle'));
  } catch (e) { setMood('idle'); }
}

const mic = document.getElementById('mic');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  mic.style.display = 'block';
  mic.onclick = () => {
    const rec = new SR();
    rec.lang = 'en-US';
    mic.classList.add('listening');
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript.trim();
      if (text) {
        voiceOn = true; renderVoiceBtn(); // spoken question -> spoken answer
        inp.value = text;
        f.requestSubmit();
      }
    };
    rec.onend = rec.onerror = () => mic.classList.remove('listening');
    rec.start();
  };
}

function add(who, text, extra) {
  const m = document.createElement('div');
  m.className = 'msg ' + (who === 'You' ? 'me' : '') + (extra || '');
  m.innerHTML = (who === 'You' ? '' : '<img class="avatar" src="assets/avatar.png" alt="" width="34" height="34">') +
    '<div class="bubble"><div class="who"></div><span class="t"></span></div>';
  m.querySelector('.who').textContent = who;
  m.querySelector('.t').textContent = text;
  log.appendChild(m);
  m.scrollIntoView({behavior: 'smooth', block: 'end'});
  return m;
}

function chips(opts) {
  const c = document.createElement('div');
  c.className = 'chips';
  for (const o of opts) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = o;
    b.onclick = () => { inp.value = o; f.requestSubmit(); };
    c.appendChild(b);
  }
  log.appendChild(c);
}

async function ask(text) {
  add('You', text);
  document.querySelectorAll('.chips').forEach(e => e.remove());
  const wait = add('Lucienne', '', ' thinking');
  setMood('thinking');
  send.disabled = true;
  try {
    const r = await fetch('chat', {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({session_id: sid, message: text, speak: voiceOn})
    });
    const data = await r.json();
    wait.classList.remove('thinking');
    wait.querySelector('.t').textContent = data.reply || data.error || 'Something went quiet on my end — try once more?';
    setMood('idle');
    if (data.audio && voiceOn) speakReply(data.audio);
    else delight();
  } catch (e) {
    wait.classList.remove('thinking');
    setMood('idle');
    wait.querySelector('.t').textContent = 'I could not reach my inspection desk (' + e.message + '). Try again in a moment.';
  }
  send.disabled = false;
  inp.focus();
}

f.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  ask(text);
});

add('Lucienne', "Bonjour! I'm Lucienne. Give me a website address and I'll look under the hood — speed, search visibility, the lot — and explain it in plain words.");
chips(['Audit hero-apps.com', 'What do you check, exactly?']);
</script>
</body>
</html>
